<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1A3F" />
    <meta name="description" content="Sistem Kas Operasional DPBJ Universitas Indonesia — pencatatan dan pelacakan pengajuan Konsumsi & Transport." />
    <title>Kas Operasional DPBJ UI</title>
    <script>
      // Terapkan mode & tema warna sebelum render agar tidak berkedip.
      (function () {
        var root = document.documentElement;
        root.setAttribute('data-warna', 'dpbj');
        try {
          var t = localStorage.getItem('kas-tema');
          var gelap = t === 'gelap' || (t !== 'terang' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (gelap) root.classList.add('dark');
          var w = localStorage.getItem('kas-warna');
          if (w === 'ui' || w === 'pink') root.setAttribute('data-warna', w);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
